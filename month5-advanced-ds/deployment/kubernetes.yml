apiVersion: apps/v1
kind: Deployment
metadata:
  name: ds-project-api
  labels:
    app: ds-project-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ds-project-api
  template:
    metadata:
      labels:
        app: ds-project-api
    spec:
      containers:
      - name: api
        image: ds-project-api:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ds-project-service
spec:
  selector:
    app: ds-project-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
